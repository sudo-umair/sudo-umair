<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-label="Muhammad Umair, Full Stack Engineer">
  <style>
    .sans { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .rule { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.4s cubic-bezier(.2,.7,.2,1) .2s forwards; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .rule { animation: none; stroke-dashoffset: 0; } .dot { animation: none; } }
  </style>
  <text class="mono" x="20" y="44" font-size="18" letter-spacing="1.5" fill="#9a9ca6">FULL STACK ENGINEER / RAWALPINDI, PK</text>
  <g transform="translate(20 66)">
    <rect width="190" height="38" rx="19" fill="#7d8bff"/>
    <circle class="dot" cx="23" cy="19" r="5" fill="#0c0d10"/>
    <text class="mono" x="40" y="25" font-size="15" letter-spacing="1" fill="#0c0d10">OPEN TO WORK</text>
  </g>
  <text class="sans" x="16" y="210" font-size="90" font-weight="800" letter-spacing="-3" fill="#ededf0">Muhammad</text>
  <text class="sans" x="16" y="306" font-size="90" font-weight="800" letter-spacing="-3" fill="#ededf0">Umair<tspan fill="#7d8bff">.</tspan></text>
  <line class="rule" x1="20" y1="338" x2="580" y2="338" stroke="#ededf0" stroke-width="2"/>
  <text class="sans" x="20" y="382" font-size="27" fill="#9a9ca6">I build <tspan fill="#ededf0" font-weight="700">web</tspan>, <tspan fill="#ededf0" font-weight="700">mobile</tspan> and <tspan fill="#ededf0" font-weight="700">TV</tspan> apps</text>
  <text class="sans" x="20" y="418" font-size="27" fill="#9a9ca6">with React, React Native and Node.</text>
</svg>
